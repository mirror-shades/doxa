name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (${{ matrix.arch }} ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    arch: x86_64 }   # x86_64 Linux
          - { os: ubuntu-24.04-arm, arch: aarch64 }  # aarch64 Linux
          # - { os: macos-13,         arch: x86_64 }   # Intel macOS lack of github runners blocks CI
          - { os: macos-15,         arch: aarch64 }  # Apple Silicon macOS
          - { os: windows-latest,   arch: x86_64 }   # x86_64 Windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # One job is enough for the platform-independent checks. Linux's
      # checkout keeps LF line endings, which `zig fmt` requires.
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: zig fmt --check src test scripts std build.zig

      - name: Build
        run: zig build

      # `zig build test` also checks that std/zerr/zerr.doxa and
      # docs/stdlib-api.md are current.
      - name: Test
        run: zig build test

      # Cross-builds the release binaries for every platform.
      - name: Release build
        if: matrix.os == 'ubuntu-latest'
        run: zig build release -Doutput-dir=release-out
